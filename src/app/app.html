<main class="container">
        <h1>{{title()}}</h1>
    <nav class="nav-bar">
        @if (errorServ.errorMessage(); as m) {
            <div class="error-banner">
                <span>{{ m }}</span>
                <button (click)="errorServ.clear()">Dismiss</button>
            </div>
        }
        @if (loading.isLoading()) {
               <div class="dual-ring"></div>
        }
        <div class="
        {{pathServ.guardEnabled() ? 'unlock' : 'lock'}}
        " (click)="toggleLock()">
            {{ pathServ.guardEnabled() ? '🔓' : '🔒' }}
        </div>
        <a routerLinkActive="active" routerLink="/paths" [routerLinkActiveOptions]="{ exact: true }">All Characters</a>
        <a routerLinkActive="active" routerLink="/add">Add Character</a>
        <a routerLinkActive="active" routerLink="/my-paths">My Characters</a>
        <a routerLinkActive="active" routerLink="/favourites">Favourites ( {{favouriteLength()}} )</a>
    </nav>
    <router-outlet/>
</main>
