<div class="path-wrapper">
    @for (path of pathList(); track path.id; let idx = $index, even = $even){
        <app-path-card
        [index]="idx" 
        [even]="even" 
        [isFavourite]="pathServ.isFavourite(path.id)"
        (selected)="onPathOpen($event)" 
        (favouriteToggled)="pathServ.toggleFavourite($event)"
        [path]="path"
        (remove)="onPathRemove($event)"
        />
    }@empty{
        <div>No trails match</div>
    }
</div>
