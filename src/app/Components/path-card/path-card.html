<section class="path-card" [class.favourite]="isFavourite()" (click)="toggleCard()">
    <!-- Removed the "" Parentheses from the Title -->
    <h3>{{path().name | titlecase | replaceText: '"' : ' ' }}</h3>    
    <img src="{{path().image}}" width="200"/>
    @if(expanded){
        
        <dl>
            @if(path().description){
                    <dt>{{ path().description  | slice:0:100 | trunc:200 }}</dt>
            }@else{
                <dt>No description provided</dt>
            }
            <div id="id-wrapper">
                <span id="char-id">ID: {{path()._id | uppercase | slice:0:12}}</span>
            </div>
        </dl>
    }
    <!-- <button
    type="button"
    id="svgelem"
    (click)="toggleFavourite($event)"
    >

    </button> -->
    <button
    id="hide-stats"
    (click)="hideStats($event)">
    {{expanded ? "Hide Stats" : "Reveal Stats"}}
    </button>
    <!-- <button
    id="remove-path"
    (click)="removePath($event)"
    >
        Remove Character
    </button> -->
    <button
        id="view-details"
        (click)="$event.stopPropagation()"
        [routerLink]="['/paths', path()._id]"

    </button>

</section>
