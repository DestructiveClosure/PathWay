<section class="path-card" [class.favourite]="isFavourite()" (click)="toggleCard()">
    <h3>{{path().name}}</h3>    
    @if(expanded){
        <span>Star Wars <br/>Character #{{index() + 1}}</span>
        <dl>
            @if(path().description){
                    <dt>{{
                        path().description}}</dt>
            }@else{
                <dt>No description provided</dt>
            }
        </dl>
    }
