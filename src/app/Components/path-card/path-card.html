<section class="path-card" [class.favourite]="isFavourite()" (click)="toggleCard()">
    <!-- Removed the "" Parentheses from the Title -->
     <!-- 
    FINISHED: Part 1: Used 3 different built in pipes
    FINISHED:  
    Part 2: trunc takes the current string and trims it if the length is more than 120 characters while ending it with ...
    replaceText takes the quotation first argument and replaces it with the second
     -->
    <h3>{{path().name | titlecase| replaceText: '"' : ' ' }}</h3>    
    <img src="{{path().image}}" width="200"/>
    @if(expanded){
        
        <dl>
            @if(path().description){
                
                    <dt>{{ path().description  | defaultTxt: "No description available" | trunc: 150 }}</dt>
            }@else{
                <dt>No description provided</dt>
            }
            <div id="id-wrapper">
                <span id="char-id">ID: {{path()._id | uppercase | slice:0:12}}</span>
            </div>
        </dl>
    }
    <!-- <button
    type="button"
    id="svgelem"
    (click)="toggleFavourite($event)"
    >
        <span id="star">{{isFavourite() ? '★' : '☆'}}</span>
    </button> -->
    <button
    id="hide-stats"
    (click)="hideStats($event)">
    {{expanded ? "Hide Stats" : "Reveal Stats"}}
    </button>
    <!-- <button
    id="remove-path"
    (click)="removePath($event)"
    >
        Remove Character
    </button> -->
    <button
        id="view-details"
        (click)="$event.stopPropagation()"
        [routerLink]="['/paths', path()._id]"
    >
        View Details
    </button>
    <!-- FINISHED: PART 1 -->
    <!-- Copying path info and description with copyText directive -->
    <button
        type="button"
        id="copy-path"
        (click)="$event.stopPropagation()"
        (appCopyTextCopied)="showCopiedNotice()"
        [appCopyText]="'Character: ' + path().name + ' — ' + (path().description ?? 'No description available')"
    >
        {{ copied() ? 'Copied!' : 'Copy path info' }}
    </button>

</section>
