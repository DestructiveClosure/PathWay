@if (path.isLoading()) {
  <p>Loading brewery...</p>
} @else if (path.error()) {
  <!-- This is not the 404 page. The URL matched a route, breweries/:id,
       but the API could not return a brewery for that id. -->
  <p class="error">Could not load Character {{ id() }}.</p>
  <button type="button" (click)="path.reload()">Try again</button>
  <a routerLink="/paths">Back to all characters</a>
} @else if (path.hasValue()) {
  @let p = path.value();
  <article class="detail">
    <h2>{{ p.name }}</h2>
    <p>{{p.description}}</p>
  </article>

  <a routerLink="/paths">Back to all characters</a>
}
