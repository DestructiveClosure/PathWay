<h2>Characters</h2>

@for (p of pathServ.pathList(); track p._id) {
  <article class="path-card">
    <h3>{{ p.name }}</h3>
    <img src="{{p.image}}" width="200"/>
    <dl>
        
        @if(p.description){
                <dt>{{p.description}}</dt>
        }@else{
            <dt>No description provided</dt>
        }
        
    </dl>
    <!-- <button
    id="remove-path"
    (click)="pathServ.removePath(p._id)"
    >
        Remove Character
    </button> -->
    <!-- FINISHED: Part 2 - Wiring up the button -->
    <button
        type="button"
        id="remove-path"
        [appConfirm]="'Remove ' + p.name + '?'"
        (confirmed)="pathServ.removePath(p._id)"
    >
        Remove Character
    </button>
    <button
        id="view-details"
        (click)="$event.stopPropagation()"
        [routerLink]="['/edit', p._id]"
    >
        Edit Character
    </button>
  </article>
} @empty {
  <p>You have not added any characters yet.</p>
}
